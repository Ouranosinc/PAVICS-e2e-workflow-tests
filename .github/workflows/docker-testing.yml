name: Docker-based Testing Suite

on:
  pull_request:
    paths:
      - "docker/Dockerfile"
      - "docker/environment-common.yml"
      - "docker/environment-core.yml"

concurrency:
  # For a given workflow, if we push to the same branch, cancel all previous builds on that branch except on master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image and run smoke tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "pavics/workflow-tests"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image to Docker daemon
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            BUILDKIT_PROGRESS=plain
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: "{{defaultContext}}:docker"
          file: "Dockerfile"
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Run smoke tests on built image
        run: |
          # Inspect labels
          docker inspect --format='{{json .Config.Labels}}' ${{ env.IMAGE_NAME }}:staging
          
          # Ensure Python is accessible
          docker run --rm ${{ env.IMAGE_NAME }}:staging python -c "import sys; print(f'Python {sys.version}')"

      - name: Gather artifacts (staging)
        if: |
          ${{ startsWith('staging', github.ref_name) }}
        run: |
          docker create --name staging ${{ env.IMAGE_NAME }}:staging
          mkdir -p build-artifacts
          docker cp staging:/conda-env-export-final.yml build-artifacts/conda-env-export.yml
          docker rm staging

      - name: Publish Image to Docker Hub (staging)
        if: |
          ${{ startsWith('staging', github.ref_name) }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          context: "{{defaultContext}}:docker"
          file: "Dockerfile"
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Upload Artifacts (staging)
        if: |
          ${{ startsWith('staging', github.ref_name) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-env-export.yml
          path: build-artifacts
