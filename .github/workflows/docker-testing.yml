name: Docker-based Testing Suite

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  # For a given workflow, if we push to the same branch, cancel all previous builds on that branch except on master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image and run smoke tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "pavics/workflow-tests"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            BUILDKIT_PROGRESS=plain
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: "{{defaultContext}}:docker"
          labels: ${{ steps.meta.outputs.labels }}
          file: "Dockerfile"
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Inspect labels
        run: |
          docker inspect --format='{{json .Config.Labels}}' ${{ env.IMAGE_NAME }}:test

      - name: Gather artifacts
        run: |
          docker create --name test ${{ env.IMAGE_NAME }}:test
          mkdir build-artifacts
          docker cp test:/conda-env-export-final.yml build-artifacts/conda-env-export.yml
          docker rm test

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-env-export.yml
          path: build-artifacts
